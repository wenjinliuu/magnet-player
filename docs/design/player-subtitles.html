<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>播放 · 字幕面板</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8FB0FF}a:hover{color:#B5CBFF}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #000000; color: #F2F3F5; font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'MiSans', system-ui, sans-serif; display: flex">

<div style="flex: 1; position: relative; min-width: 0">
<div role="img" aria-label="视频画面占位" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #33394A 0%, #151820 50%, #000000 85%); display: flex; align-items: center; justify-content: center">
<span style="font-size: 14px; letter-spacing: 0.2em; color: rgba(255,255,255,0.28)">视频画面</span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.35)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.9)">
<div style="font-size: 17px; color: rgba(255,255,255,0.85)">ありがとう、また明日。</div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px; color: #FFFFFF">谢谢，明天见。</div>
</div>
</div>

<aside aria-label="字幕设置" style="width: 380px; flex-shrink: 0; background: #121318; border-left: 1px solid #1E2026; padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">字幕</h2>
<button aria-label="关闭面板" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #C9CDD4; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
</button>
</div>

<div style="font-size: 12px; font-weight: 600; color: #9AA0AB; padding: 4px 2px">可用字幕</div>
<button style="display: flex; align-items: center; gap: 12px; border: 1.5px solid #FF5C99; background: rgba(255,92,153,0.10); border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit; color: #F2F3F5">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #FF3D7F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 12h8M8 16h5"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">中文字幕.ass</span><span style="display: block; font-size: 12px; color: #9AA0AB; margin-top: 2px">种子内自带</span></span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF8FB8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</button>
<button style="display: flex; align-items: center; gap: 12px; border: none; background: transparent; border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit; color: #F2F3F5">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #24272E; color: #9AA0AB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/></svg></span>
<span style="font-size: 15px; font-weight: 500">关闭字幕</span>
</button>

<div style="height: 1px; background: #1E2026; margin: 8px 0"></div>
<div style="font-size: 12px; font-weight: 600; color: #9AA0AB; padding: 4px 2px">获取更多</div>
<button style="display: flex; align-items: center; gap: 12px; border: none; background: transparent; border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit; color: #F2F3F5">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #2F6BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">在线搜索字幕</span><span style="display: block; font-size: 12px; color: #9AA0AB; margin-top: 2px">伪射手 · 迅雷</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B717C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>
<button style="display: flex; align-items: center; gap: 12px; border: none; background: transparent; border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit; color: #F2F3F5">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #7C5CFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">AI 识别并翻译</span><span style="display: block; font-size: 12px; color: #9AA0AB; margin-top: 2px">日语 → 中文，双语显示</span></span>
<span style="font-size: 11px; font-weight: 700; color: #BBAEFF; background: rgba(155,133,255,0.16); border-radius: 6px; padding: 3px 7px">第二期</span>
</button>
<button style="display: flex; align-items: center; gap: 12px; border: none; background: transparent; border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit; color: #F2F3F5">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #12B886; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">从平板选择字幕文件</span><span style="display: block; font-size: 12px; color: #9AA0AB; margin-top: 2px">SRT · ASS · VTT</span></span>
</button>

<div style="flex: 1"></div>
<div style="height: 1px; background: #1E2026; margin: 8px 0"></div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 2px">
<span style="font-size: 15px; font-weight: 500">双语显示</span>
<button aria-pressed="true" aria-label="双语显示" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: #20B985; position: relative; cursor: pointer; padding: 0"><span aria-hidden="true" style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 2px">
<span style="font-size: 15px; font-weight: 500">字号</span>
<div style="display: flex; background: #1E2026; border-radius: 12px; padding: 3px">
<button style="border: none; background: transparent; border-radius: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; color: #C9CDD4">小</button>
<button style="border: none; background: #FF8A00; border-radius: 9px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; color: #1F0F00">标准</button>
<button style="border: none; background: transparent; border-radius: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; color: #C9CDD4">大</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 2px">
<span style="font-size: 15px; font-weight: 500">字幕时间偏移</span>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="字幕提前 0.5 秒" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: #1E2026; color: #F2F3F5; font-size: 18px; cursor: pointer; font-family: inherit">−</button>
<span style="width: 56px; text-align: center; font-size: 14px; font-weight: 600; color: #8FB0FF; font-variant-numeric: tabular-nums">0.0 秒</span>
<button aria-label="字幕延后 0.5 秒" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: #1E2026; color: #F2F3F5; font-size: 18px; cursor: pointer; font-family: inherit">+</button>
</div>
</div>
</aside>
</div>
</body>
</html>
