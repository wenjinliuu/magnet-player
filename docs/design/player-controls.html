<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>播放 · 控件显示</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8FB0FF}a:hover{color:#B5CBFF}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'MiSans', system-ui, sans-serif">
<div role="img" aria-label="视频画面占位" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #33394A 0%, #151820 50%, #000000 85%); display: flex; align-items: center; justify-content: center">
<span style="font-size: 14px; letter-spacing: 0.2em; color: rgba(255,255,255,0.28); margin-top: 200px">视频画面</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0))"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.8))"></div>

<div style="position: absolute; top: 24px; left: 32px; right: 32px; display: flex; align-items: center; gap: 14px">
<button aria-label="返回" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<div>
<div style="font-size: 18px; font-weight: 600">示例视频 Part 1</div>
<div style="font-size: 13px; color: rgba(255,255,255,0.72); margin-top: 2px">2160p · HEVC · 8.2 GB</div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 18px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">
<span style="display: flex; align-items: center; gap: 6px; color: #3DE0A6"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13M6 12l6 6 6-6"/></svg>8.4 MB/s</span>
<span style="display: flex; align-items: center; gap: 6px; color: #B6A6FF"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><path d="M16 5a3 3 0 0 1 0 6M18 14c1.6.6 2.6 2.2 3 5"/></svg>46 节点</span>
<span style="display: flex; align-items: center; gap: 6px; color: #FFC27A"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h.01M11 15h6"/></svg>缓冲 186 / 300 MB</span>
</div>
<button aria-label="字幕" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; color: #FF6FA3; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg>
</button>
<button aria-label="更多" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
</button>
</div>

<div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 56px">
<button aria-label="后退 10 秒" style="width: 64px; height: 64px; border-radius: 50%; border: none; background: rgba(0,0,0,0.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><text x="12.5" y="15.2" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text></svg>
</button>
<button aria-label="暂停" style="width: 88px; height: 88px; border-radius: 50%; border: none; background: #2F6BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.8" height="14" rx="1.2" fill="currentColor"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.2" fill="currentColor"/></svg>
</button>
<button aria-label="前进 10 秒" style="width: 64px; height: 64px; border-radius: 50%; border: none; background: rgba(0,0,0,0.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/><text x="11.5" y="15.2" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text></svg>
</button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 138px; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.9)">
<div style="font-size: 17px; color: rgba(255,255,255,0.85)">ありがとう、また明日。</div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px">谢谢，明天见。</div>
</div>

<div style="position: absolute; left: 40px; right: 40px; bottom: 28px; display: flex; flex-direction: column; gap: 14px">
<div role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="7080" aria-valuenow="2530" aria-valuetext="42 分 10 秒" style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); position: relative">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 41%; border-radius: 3px; background: rgba(255,255,255,0.45)"></div>
<div aria-hidden="true" style="position: absolute; left: 61%; top: 0; bottom: 0; width: 7%; border-radius: 3px; background: rgba(255,255,255,0.45)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 36%; border-radius: 3px; background: #2F6BFF"></div>
<div aria-hidden="true" style="position: absolute; left: 36%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 4px #2F6BFF"></div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">42:10 <span style="color: rgba(255,255,255,0.6); font-weight: 500">/ 1:58:00</span></span>
<span style="margin-left: 14px; display: flex; align-items: center; gap: 14px; font-size: 12px; color: rgba(255,255,255,0.72)">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 4px; border-radius: 2px; background: #2F6BFF"></span>已播放</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.45)"></span>已下载片段</span>
</span>
<div style="flex: 1"></div>
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #FF3D7F; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit">字幕 中/日</button>
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #FF8A00; color: #1F0F00; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit">1.0×</button>
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #7C5CFF; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit">原画 2160p</button>
<button aria-label="锁定屏幕" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
</button>
<button aria-label="画中画" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><rect x="12" y="12" width="6" height="4.5" rx="1"/></svg>
</button>
</div>
</div>
</div>
</body>
</html>
